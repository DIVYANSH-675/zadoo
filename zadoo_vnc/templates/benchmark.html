<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Zadoo Stream Benchmark</title>
    <style>
        :root {
            color-scheme: dark;
            --bg: #0b1118;
            --panel: #121b25;
            --line: #263746;
            --text: #e7f7ff;
            --muted: #9ab0bf;
            --accent: #00d4ff;
        }
        * { box-sizing: border-box; }
        body {
            margin: 0;
            min-height: 100vh;
            overflow: hidden;
            background: var(--bg);
            color: var(--text);
            font-family: Inter, Segoe UI, Arial, sans-serif;
        }
        .shell {
            display: grid;
            grid-template-columns: minmax(0, 1fr) 280px;
            min-height: 100vh;
        }
        canvas {
            width: 100%;
            height: 100vh;
            display: block;
            background: #061018;
        }
        aside {
            border-left: 1px solid var(--line);
            background: var(--panel);
            padding: 18px;
        }
        h1 {
            margin: 0 0 16px;
            font-size: 18px;
            font-weight: 700;
            letter-spacing: 0;
        }
        .metric {
            display: flex;
            justify-content: space-between;
            gap: 12px;
            padding: 10px 0;
            border-bottom: 1px solid rgba(255, 255, 255, 0.08);
            font-size: 13px;
        }
        .metric span:first-child { color: var(--muted); }
        .metric span:last-child { color: var(--accent); font-weight: 700; }
        .note {
            margin-top: 16px;
            color: var(--muted);
            font-size: 12px;
            line-height: 1.5;
        }
        @media (max-width: 760px) {
            .shell { grid-template-columns: 1fr; }
            aside {
                position: fixed;
                left: 10px;
                right: 10px;
                bottom: 10px;
                border: 1px solid var(--line);
                border-radius: 8px;
                padding: 12px;
            }
            h1 { display: none; }
            .metric { padding: 6px 0; }
            .note { display: none; }
        }
    </style>
</head>
<body>
    <div class="shell">
        <canvas id="stage"></canvas>
        <aside>
            <h1>Stream Benchmark</h1>
            <div class="metric"><span>Animation FPS</span><span id="fps">0</span></div>
            <div class="metric"><span>Frame Time</span><span id="frame-ms">0 ms</span></div>
            <div class="metric"><span>Canvas Size</span><span id="size">0 x 0</span></div>
            <div class="metric"><span>Motion</span><span>Display refresh</span></div>
            <p class="note">Open this on the host display while viewing the remote stream. It creates high-contrast motion so duplicate frames and delay are easy to spot.</p>
        </aside>
    </div>
    <script>
        const canvas = document.getElementById('stage');
        const ctx = canvas.getContext('2d', { alpha: false });
        const fpsEl = document.getElementById('fps');
        const frameMsEl = document.getElementById('frame-ms');
        const sizeEl = document.getElementById('size');
        let last = performance.now();
        let frames = 0;
        let fpsWindow = last;

        function resize() {
            const dpr = Math.max(1, Math.min(2, window.devicePixelRatio || 1));
            const w = Math.floor(canvas.clientWidth * dpr);
            const h = Math.floor(canvas.clientHeight * dpr);
            if (canvas.width !== w || canvas.height !== h) {
                canvas.width = w;
                canvas.height = h;
                sizeEl.textContent = `${w} x ${h}`;
            }
        }

        function draw(now) {
            resize();
            const w = canvas.width;
            const h = canvas.height;
            const dt = now - last;
            last = now;
            frames += 1;

            ctx.fillStyle = '#061018';
            ctx.fillRect(0, 0, w, h);

            const t = now * 0.001;
            const stripeWidth = Math.max(24, Math.floor(w / 24));
            for (let x = -stripeWidth; x < w + stripeWidth; x += stripeWidth) {
                const offset = ((t * 480) % (stripeWidth * 2));
                ctx.fillStyle = ((Math.floor((x + offset) / stripeWidth) & 1) === 0) ? '#00d4ff' : '#ffcc66';
                ctx.fillRect(x + offset - stripeWidth, 0, Math.ceil(stripeWidth * 0.55), h);
            }

            const radius = Math.max(18, Math.min(w, h) * 0.055);
            const x = (Math.sin(t * Math.PI * 2.0) * 0.42 + 0.5) * w;
            const y = (Math.cos(t * Math.PI * 1.4) * 0.34 + 0.5) * h;
            ctx.fillStyle = '#f8fbff';
            ctx.beginPath();
            ctx.arc(x, y, radius, 0, Math.PI * 2);
            ctx.fill();

            ctx.fillStyle = '#101820';
            ctx.font = `${Math.max(28, Math.floor(h * 0.08))}px Segoe UI, Arial, sans-serif`;
            ctx.textAlign = 'center';
            ctx.textBaseline = 'middle';
            ctx.fillText(String(Math.floor(now / 100) % 1000).padStart(3, '0'), w / 2, h / 2);

            frameMsEl.textContent = `${dt.toFixed(1)} ms`;
            if (now - fpsWindow >= 1000) {
                const fps = frames * 1000 / (now - fpsWindow);
                fpsEl.textContent = fps.toFixed(0);
                frames = 0;
                fpsWindow = now;
            }
            requestAnimationFrame(draw);
        }

        window.addEventListener('resize', resize);
        requestAnimationFrame(draw);
    </script>
</body>
</html>
