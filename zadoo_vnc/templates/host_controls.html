<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <title>Host Controls — Alerts</title>
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <style>
    body { font-family: system-ui, -apple-system, Segoe UI, Roboto, Arial; background:#0f1115; color:#eaeef2; margin:0; }
    .wrap { max-width: 720px; margin: 32px auto; padding: 16px; }
    h1 { font-size: 20px; font-weight:600; margin: 0 0 16px; }
    .grid { display:grid; grid-template-columns: repeat(4, minmax(0,1fr)); gap:12px; }
    button { appearance: none; border:0; border-radius:12px; padding:16px 0; font-size:18px; font-weight:700; background:#1b1f2a; color:#eaeef2; cursor:pointer; transition:transform .05s ease, background .2s ease; box-shadow: 0 1px 0 rgba(255,255,255,.05) inset, 0 6px 24px rgba(0,0,0,.4); }
    button:hover{ background:#222835; }
    button:active{ transform:scale(.98); }
    .ok { margin-top:14px; color:#9fb3c8; font-size:13px; min-height: 18px; }
  </style>
  </head>
  <body>
    <div class="wrap">
      <h1>Send Sidebar Alert to Viewers</h1>
      <div class="grid">
        <button data-code="A">A</button>
        <button data-code="B">B</button>
        <button data-code="C">C</button>
        <button data-code="D">D</button>
      </div>
      <div class="ok" id="ok"></div>
    </div>
    <script>
      const ok = document.getElementById('ok');
      let rpcSequence = 0;
      function callRpc(action, params, timeoutMs=10000){
        return new Promise((resolve,reject)=>{
          const id=`alerts-${Date.now()}-${++rpcSequence}`;
          const proto=location.protocol==='https:'?'wss':'ws';
          const socket=new WebSocket(`${proto}://${location.host}/rpc`);
          let finished=false;
          const finish=(error,result)=>{
            if(finished)return;
            finished=true;
            clearTimeout(timer);
            try{socket.close(1000,'RPC complete');}catch(_){}
            if(error)reject(error);else resolve(result);
          };
          const timer=setTimeout(()=>finish(new Error(`RPC ${action} timed out`)),timeoutMs);
          socket.onopen=()=>socket.send(JSON.stringify({id,action,params}));
          socket.onmessage=event=>{
            try{
              const data=JSON.parse(event.data);
              if(!data||typeof data!=='object'||Array.isArray(data))throw new Error(`RPC ${action} returned a non-object response`);
              if(data.id!==id)throw new Error(`RPC ${action} returned a mismatched id`);
              if(typeof data.success!=='boolean')throw new Error(`RPC ${action} response is missing boolean success`);
              if(!data.success)throw new Error(typeof data.error==='string'&&data.error?data.error:`RPC ${action} failed`);
              finish(null,data.result);
            }catch(error){finish(error instanceof Error?error:new Error(String(error)));}
          };
          socket.onerror=()=>finish(new Error(`RPC ${action} WebSocket failed`));
          socket.onclose=event=>{if(!finished)finish(new Error(`RPC ${action} closed before a response (${event.code})`));};
        });
      }
      document.querySelectorAll('button[data-code]').forEach(btn=>{
        btn.addEventListener('click', async ()=>{
          const code = btn.getAttribute('data-code');
          try{
            const data = await callRpc('alert.trigger', {code});
            if (!data || data.ok !== true) throw new Error('Alert RPC result is invalid');
            ok.textContent = ' Sent '+code;
          }catch(e){ ok.textContent = ' Failed: '+String(e instanceof Error ? e.message : e); }
          setTimeout(()=> ok.textContent='', 2000);
        });
      });
    </script>
  </body>
  </html>
