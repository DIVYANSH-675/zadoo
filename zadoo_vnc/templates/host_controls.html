<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Zadoo · Host alerts</title>
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <style>
    * { box-sizing:border-box; }
    body { font-family: system-ui, -apple-system, Segoe UI, Roboto, Arial; background:#080e14; color:#edf8ff; margin:0; }
    .wrap { max-width: 720px; margin: 8vh auto; padding: 24px; }
    .brand { color:#60dbea; font-size:13px; letter-spacing:2px; font-weight:700; }
    h1 { font-size: clamp(26px,6vw,38px); font-weight:650; letter-spacing:-1px; margin:24px 0 12px; }
    p { color:#a2bac9; font-size:14px; line-height:1.7; margin:0 0 28px; }
    .grid { display:grid; grid-template-columns: repeat(4, minmax(0,1fr)); gap:12px; }
    button { appearance: none; border:1px solid #304d5e; border-radius:18px; min-height:110px; padding:16px 0; font-size:30px; font-weight:600; background:#101e29; color:#60dbea; cursor:pointer; transition:transform .12s ease, background .2s ease; }
    button small { display:block; margin-top:10px; font-size:11px; font-weight:500; color:#a2bac9; }
    button:hover{ background:#19323f; }
    button:focus-visible { outline:2px solid #60dbea; outline-offset:4px; }
    button:active{ transform:scale(.98); }
    .ok { margin-top:14px; color:#9fb3c8; font-size:13px; min-height: 18px; }
    @media(max-width:480px) { .grid { grid-template-columns:repeat(2,minmax(0,1fr)); } }
    @media(prefers-reduced-motion:reduce) { button { transition:none; } }
  </style>
  </head>
  <body>
    <div class="wrap">
      <div class="brand">zadoo / host controls</div>
      <h1>Keep everyone in the loop.</h1>
      <p>Send a preset message to connected viewers. Edit and enable your messages in the Windows app under Settings → Alerts.</p>
      <div class="grid">
        <button data-code="A" aria-label="Send alert A">A<small>Send alert</small></button>
        <button data-code="B" aria-label="Send alert B">B<small>Send alert</small></button>
        <button data-code="C" aria-label="Send alert C">C<small>Send alert</small></button>
        <button data-code="D" aria-label="Send alert D">D<small>Send alert</small></button>
      </div>
      <div class="ok" id="ok" role="status" aria-live="polite"></div>
    </div>
    <script>
      const ok = document.getElementById('ok');
      let rpcSequence = 0;
      function callRpc(action, params, timeoutMs=10000){
        return new Promise((resolve,reject)=>{
          const id=`alerts-${Date.now()}-${++rpcSequence}`;
          const proto=location.protocol==='https:'?'wss':'ws';
          const socket=new WebSocket(`${proto}://${location.host}/rpc`);
          let finished=false;
          const finish=(error,result)=>{
            if(finished)return;
            finished=true;
            clearTimeout(timer);
            try{socket.close(1000,'RPC complete');}catch(_){}
            if(error)reject(error);else resolve(result);
          };
          const timer=setTimeout(()=>finish(new Error(`RPC ${action} timed out`)),timeoutMs);
          socket.onopen=()=>socket.send(JSON.stringify({id,action,params}));
          socket.onmessage=event=>{
            try{
              const data=JSON.parse(event.data);
              if(!data||typeof data!=='object'||Array.isArray(data))throw new Error(`RPC ${action} returned a non-object response`);
              if(data.id!==id)throw new Error(`RPC ${action} returned a mismatched id`);
              if(typeof data.success!=='boolean')throw new Error(`RPC ${action} response is missing boolean success`);
              if(!data.success)throw new Error(typeof data.error==='string'&&data.error?data.error:`RPC ${action} failed`);
              finish(null,data.result);
            }catch(error){finish(error instanceof Error?error:new Error(String(error)));}
          };
          socket.onerror=()=>finish(new Error(`RPC ${action} WebSocket failed`));
          socket.onclose=event=>{if(!finished)finish(new Error(`RPC ${action} closed before a response (${event.code})`));};
        });
      }
      document.querySelectorAll('button[data-code]').forEach(btn=>{
        btn.addEventListener('click', async ()=>{
          const code = btn.getAttribute('data-code');
          try{
            const data = await callRpc('alert.trigger', {code});
            if (!data || data.ok !== true) throw new Error('Alert RPC result is invalid');
            ok.textContent = ' Sent '+code;
          }catch(e){ ok.textContent = ' Failed: '+String(e instanceof Error ? e.message : e); }
          setTimeout(()=> ok.textContent='', 2000);
        });
      });
    </script>
  </body>
  </html>
