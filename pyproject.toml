[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "zadoo-vnc"
version = "0.1.0"
description = "Windows-focused web VNC runtime with screen capture, input, clipboard, and Cloudflare tunnel support."
readme = "README.md"
requires-python = ">=3.11,<3.12"
dependencies = [
  "websockets==15.0.1",
  "mss==10.2.0",
  "PyAutoGUI==0.9.54",
  "Pillow==12.0.0",
  "numpy==2.2.6",
  "pyperclip==1.11.0",
  "keyboard==0.13.5",
  "pywin32==311; platform_system == 'Windows'",
  "python-dotenv==1.2.1",
  "pygrabber==0.2; platform_system == 'Windows'",
  "av==17.0.1",
]

[project.optional-dependencies]
media = ["sounddevice", "soundcard", "av==17.0.1", "aiortc"]
email = ["resend"]
perf = ["dxcam", "opencv-python", "fast-ctypes-screenshots", "bettercam", "imagecodecs"]
ssh = ["paramiko", "pywinpty"]
ocr = ["paddleocr"]

[project.scripts]
zadoo-vnc = "zadoo_vnc.app:main"

[tool.setuptools]
packages = ["zadoo_vnc"]

[tool.setuptools.package-data]
zadoo_vnc = ["templates/*.html"]
